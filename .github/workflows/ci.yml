name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "packaging/**"
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build (Debug)
        run: xcodebuild -project MacClipboard.xcodeproj -scheme MacClipboard -configuration Debug -derivedDataPath build/DerivedData build CODE_SIGNING_ALLOWED=NO

      - name: Unit Tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project MacClipboard.xcodeproj \
            -scheme MacClipboard \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO | tee build/test.log

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/test.log
            build/TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 14
