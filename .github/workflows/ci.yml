name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build (Debug)
        run: xcodebuild -project MacClipboard.xcodeproj -scheme MacClipboard -configuration Debug -derivedDataPath build/DerivedData build CODE_SIGNING_ALLOWED=NO

      - name: Unit Tests
        run: xcodebuild test -project MacClipboard.xcodeproj -scheme MacClipboard -destination 'platform=macOS' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO
